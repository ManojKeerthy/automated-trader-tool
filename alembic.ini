# A generic, single-database configuration for Alembic

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date
# timezone = UTC

# max length of characters to include in auto-generated filename
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow Pennsylvania System migrations
# (default is false)
# sourceless = false

# version location specification; this defaults
# to alembic/versions.  when using multiple version
# directories, paths must be separated by spaces or lines
# version_locations = %(here)s/bar %(here)s/bat alembic/versions

# version path separator; defaults to 'os.pathsep'
# version_path_separator = :

# set to 'true' to search for migrations in subdirectories
# recursive_version_locations = false

# the database URL is dynamically loaded in env.py from settings.database_url
sqlalchemy.url = postgresql://tradecraft:secret@localhost:5432/tradecraft

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
