[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradecraft"
version = "0.1.0"
description = "Autonomous Indian Swing Trading Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    "exchange_calendars",
    "kiteconnect",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg2-binary",
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "pydantic-settings",
    "pandas",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "E711", "E712", "B904", "B008", "TC001", "TC003", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["tradecraft"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["kiteconnect.*", "exchange_calendars.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (may require external services)",
    "property: Property-based / invariant tests",
    "slow: Tests that take significant time",
]
